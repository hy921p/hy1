# AI 智面 · nginx 网关配置
# 目录结构：/usr/share/nginx/html/web（C 端）、/admin（管理端）
# 后端 API /api → server:3000（SSE 需关闭 buffering）
#
# HTTPS 生产启用：
#   1) docker compose up -d 后，容器内执行
#      docker compose exec nginx sh -c "apk add certbot certbot-nginx && certbot --nginx -d 你的域名"
#   2) certbot 会自动生成 443 server 块并在 80 加 301 重定向，无需改本文件

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # —— C 端（history 路由，SPA fallback 到 /index.html）——
    location / {
        root /usr/share/nginx/html/web;
        try_files $uri $uri/ /index.html;
    }

    # —— 管理端（/admin 前缀，hash 路由）——
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # —— 后端 API 反向代理（含 SSE 流式面试）——
    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 关键：关闭缓冲，保持长连接
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
